# Party DJ settings. Edit freely; run `python dj.py --check-config` after changes.

party_date: 2026-10-24
start_time: "21:00"            # 24h clock, Mumbai time
duration_minutes: 300          # 9 PM to 2 AM

birthday_person_name: Ketan
host_name: Poonam
birthday_block_time: "00:00"   # midnight cake cutting; must fall inside the party

language_ratio:
  hindi: 0.7                   # at least 70% Hindi
  english: 0.3                 # at most 30% English

# DJ voice (Microsoft neural voice via edge-tts): young American male. Its tone rises and falls
# with the energy of the moment. Other options: en-US-BrianNeural, en-US-GuyNeural, en-GB-RyanNeural
dj_voice: en-US-AndrewNeural
# Some announcements come out in Hindi or Hinglish, in this voice. 0.35 = about a third of them.
hindi_voice: hi-IN-MadhurNeural
hindi_announcement_share: 0.35
# How the voice should say names, spelled out the way they sound. Tweak if a name sounds off.
name_pronunciations:
  Ketan: Kaytun
  Poonam: Poonum

# DJ mixing: how much of each song to play, and how long songs blend into each other.
song_play_min_seconds: 40      # every song plays between these two lengths; the DJ mixes out
song_play_max_seconds: 60      # at the best moment in between (a pause in the singing)
crossfade_seconds: 6

announcement_interval_songs: 4 # one announcement every 3-4 songs
vibe_check_minutes: 15         # how often to ask the host for a vibe score

# Add at any time, before or during the party. Matching is case-insensitive.
blocked_artists: []
blocked_tracks: []             # song titles, e.g. "Chaiyya Chaiyya"
requested_tracks: []           # "Title - Artist", slotted in as early as fits
