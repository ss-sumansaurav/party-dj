name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Copy the DJ's Python code into the app
        run: |
          mkdir -p android/app/src/main/python
          cp -r partydj android/app/src/main/python/
          cp config.yaml songs.yaml android/app/src/main/python/partydj/
      - name: Look up the songs on YouTube Music now, so the app doesn't on first launch
        run: |
          pip install -r requirements.txt
          python .github/scripts/resolve_songs.py android/app/src/main/python/partydj/tracks.json
      - name: Build the APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk party-dj.apk
      - uses: actions/upload-artifact@v4
        with:
          name: party-dj-apk
          path: party-dj.apk

  # Start the app on an Android emulator and check the DJ comes up, finds songs and serves its page.
  emulator-test:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: party-dj-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: bash .github/scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screen
          path: |
            screen.png
            setup.png

  voice-check:
    # The container that writes this code can't reach the voice service, so check here that the
    # DJ's voices (English and Hindi) really produce speech.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Make an English and a Hindi announcement
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          cfg = yaml.safe_load(open("config.yaml"))
          for voice, text in ((cfg["dj_voice"], "Happy Diwali, everybody! Welcome to Amit and Priya's Diwali party. Chalo, let's get this party started!"),
                              (cfg["hindi_voice"], "हाथ ऊपर! Happy Diwali, क्या party है!")):
              out = Path("voice_check") / voice
              out.parent.mkdir(exist_ok=True)
              import asyncio, edge_tts  # straight to the voice, so a missing voice can't fall back quietly
              asyncio.run(edge_tts.Communicate(text, voice).save(str(out.with_suffix(".mp3"))))
              size = out.with_suffix(".mp3").stat().st_size
              print(voice, size, "bytes")
              assert size > 10000, voice
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: voice_check/
