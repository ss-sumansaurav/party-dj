name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Copy the DJ's Python code into the app
        run: |
          mkdir -p android/app/src/main/python
          cp -r partydj android/app/src/main/python/
          cp config.yaml songs.yaml android/app/src/main/python/partydj/
      - name: Build the APK
        run: gradle -p android assembleDebug --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk party-dj.apk
      - uses: actions/upload-artifact@v4
        with:
          name: party-dj-apk
          path: party-dj.apk
